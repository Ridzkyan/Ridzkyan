<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>

    <!-- Animated Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="25%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="75%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#00e5ff" />
      <animate attributeName="x1" values="0%;-100%" dur="3s" repeatCount="indefinite" />
      <animate attributeName="x2" values="200%;100%" dur="3s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .name {
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-weight: 800;
        font-size: 48px;
        fill: url(#textGrad);
        letter-spacing: 2px;
      }
      .role {
        font-family: 'Consolas', monospace;
        font-weight: 400;
        font-size: 16px;
        fill: #94a3b8;
        letter-spacing: 4px;
      }
      .bracket {
        fill: #0ea5e9;
      }
      
      /* Simple floating animation for particles */
      @keyframes float1 { 0% { transform: translate(0, 0); opacity: 0.2; } 50% { transform: translate(0, -20px); opacity: 0.8; } 100% { transform: translate(0, 0); opacity: 0.2; } }
      @keyframes float2 { 0% { transform: translate(0, 0); opacity: 0.8; } 50% { transform: translate(-20px, -15px); opacity: 0.1; } 100% { transform: translate(0, 0); opacity: 0.8; } }
      @keyframes float3 { 0% { transform: translate(0, 0); opacity: 0.5; } 50% { transform: translate(15px, -25px); opacity: 1; } 100% { transform: translate(0, 0); opacity: 0.5; } }
      
      .p1 { animation: float1 4s ease-in-out infinite; }
      .p2 { animation: float2 5s ease-in-out infinite; }
      .p3 { animation: float3 6s ease-in-out infinite; }
      .p4 { animation: float1 7s ease-in-out infinite reverse; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="250" fill="url(#bgGrad)" rx="15" />

  <!-- Animated Particles -->
  <g fill="#00e5ff">
    <circle cx="100" cy="200" r="2" class="p1" />
    <circle cx="150" cy="50"  r="3" class="p2" />
    <circle cx="700" cy="180" r="1.5" class="p3" />
    <circle cx="650" cy="70"  r="2.5" class="p4" />
    <circle cx="50"  cy="120" r="1.5" class="p3" />
    <circle cx="750" cy="130" r="2" class="p2" />
    <circle cx="400" cy="40"  r="2" class="p1" />
    <circle cx="300" cy="210" r="3" class="p4" />
  </g>
  
  <g fill="#0ea5e9">
    <circle cx="250" cy="150" r="2" class="p4" />
    <circle cx="550" cy="90"  r="1.5" class="p1" />
    <circle cx="600" cy="220" r="2" class="p2" />
    <circle cx="200" cy="100" r="2.5" class="p3" />
  </g>

  <!-- Content Group -->
  <g transform="translate(400, 125)" text-anchor="middle">
    <!-- Subtitle Top -->
    <text y="-40" class="role"><tspan class="bracket">&lt;</tspan> HELLO WORLD <tspan class="bracket">/&gt;</tspan></text>
    
    <!-- Main Name -->
    <text y="15" class="name" filter="url(#glow)">RIDHO DZAKY RAIHAN</text>
    
    <!-- Subtitle Bottom -->
    <text y="55" class="role">CODE <tspan class="bracket">·</tspan> CREATE <tspan class="bracket">·</tspan> EVOLVE</text>
  </g>
  
</svg>
